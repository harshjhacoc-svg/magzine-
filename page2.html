    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 18px;

.wrap {
    max-width: 500px;

    font-size: clamp(32px, 8vw, 48px);

}

p {
    font-size: 20px;

    display: inline-block;
    margin-top: 30px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 1px;
    color: white;
    background: var(--pink);
    padding: 12px 28px;
    border-radius: 30px;
    text-decoration: none;
