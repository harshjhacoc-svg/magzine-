<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Secret For You 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

:root {
    --pink: #f6c4d4;
    --dark-pink: #d96b91;
    --green: #315b46;
    --cream: #fffaf4;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffe4ec 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #c8e4cf 0, transparent 35%),
        linear-gradient(135deg, #fce8ed, #e5f0df);
    color: var(--green);
}

.card {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 36px 25px;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 28px;
    background: rgba(255, 250, 244, 0.88);
    box-shadow: 0 18px 60px rgba(70, 83, 59, 0.15);
    animation: fadeIn 1.3s ease both;
    backdrop-filter: blur(12px);
}

.top-decor {
    font-size: 27px;
    margin-bottom: 12px;
    letter-spacing: 8px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(27px, 7vw, 36px);
    line-height: 1.25;
    margin-bottom: 12px;
    color: #315b46;
}

.subtitle {
    font-size: 15px;
    color: #a85e79;
    margin-bottom: 23px;
}

.photo-frame {
    width: 150px;
    height: 150px;
    margin: 0 auto 24px;
    border: 5px solid white;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 5px 20px #dca8b8;
    background: #f9dce5;
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-placeholder {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 10px;
    color: #6b796b;
}

input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #e7c5cf;
    border-radius: 14px;
    outline: none;
    background: white;
    color: #315b46;
    text-align: center;
    font-size: 17px;
    letter-spacing: 5px;
    transition: 0.2s;
}

input:focus {
    border-color: #d96b91;
    box-shadow: 0 0 0 3px #f6c4d455;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px 18px;
    border: none;
    border-radius: 14px;
    background: #315b46;
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
}

button:hover {
    background: #244735;
    transform: translateY(-2px);
}

#error {
    min-height: 22px;
    margin-top: 14px;
    color: #c94b6d;
    font-size: 13px;
    font-weight: 600;
}

.bottom-note {
    margin-top: 17px;
    font-size: 12px;
    color: #9b8b8b;
}

.music-button {
    position: fixed;
    z-index: 5;
    top: 18px;
    right: 18px;
    width: auto;
    margin: 0;
    padding: 10px 14px;
    border-radius: 30px;
    background: rgba(255,250,244,0.9);
    color: #315b46;
    border: 1px solid #ffffff;
    font-size: 12px;
    box-shadow: 0 4px 15px #00000010;
}

.music-button:hover {
    background: white;
}

.heart {
    position: fixed;
    bottom: -40px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp linear forwards;
    opacity: 0.7;
}

.flower {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    font-size: 25px;
    opacity: 0.75;
    animation: sway 4s ease-in-out infinite alternate;
}

.flower.one {
    top: 12%;
    left: 8%;
}

.flower.two {
    bottom: 12%;
    right: 8%;
    animation-delay: 1s;
}

.flower.three {
    top: 20%;
    right: 12%;
    animation-delay: 2s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.8; }
    to {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

@keyframes sway {
    from { transform: rotate(-12deg) translateY(0); }
    to { transform: rotate(12deg) translateY(-8px); }
}

@media (max-width: 480px) {
    .card {
        padding: 30px 21px;
    }

    .photo-frame {
        width: 130px;
        height: 130px;
    }

    .flower {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="music-button" id="musicButton" onclick="toggleMusic()">
    ♫ Play music
</button>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="flower one">🌷</div>
<div class="flower two">🌸</div>
<div class="flower three">🦋</div>

<main class="card">

    <div class="top-decor">🌿 ♡ 🌷</div>

    <h1 id="heading"></h1>

    <p class="subtitle">You and me forever 😙</p>

    <div class="photo-frame">
        <!-- Replace couple.jpg with your couple photo's filename -->
        <img
            src="couple.jpg"
            alt="A little picture of us"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div class="photo-placeholder" style="display:none;">💗</div>
    </div>

    <form id="passwordForm">
        <label for="password">
            enter the password (don't get it wrong!)
        </label>

        <input
            id="password"
            type="password"
            placeholder="••••"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
            required
        >

        <button type="submit">
            Unlock my heart ❤️
        </button>

        <p id="error" aria-live="polite"></p>
    </form>

    <p class="bottom-note">made with love, just for you ♡</p>

</main>

<script>
const correctPassword = "0407";

const headingText = "A little secret for you bhondu <3";
const heading = document.getElementById("heading");

let charIndex = 0;

function typeHeading() {
    if (charIndex < headingText.length) {
        heading.textContent += headingText.charAt(charIndex);
        charIndex++;
        setTimeout(typeHeading, 65);
    }
}

window.addEventListener("load", typeHeading);

// PASSWORD CHECK — CONNECTED TO PAGE 2
document.getElementById("passwordForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const enteredPassword = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (enteredPassword === correctPassword) {
        error.style.color = "#315b46";
        error.textContent = "Opening your little surprise... 💗";

        setTimeout(function() {
            window.location.href = "page2.html";
        }, 500);

    } else {
        error.textContent = "Abey oo 🤬 dhang se (hint: our birthdate)";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
    }
});

// MUSIC BUTTON
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");
let musicPlaying = false;

function toggleMusic() {
    if (!musicPlaying) {
        music.play().then(function() {
            musicPlaying = true;
            musicButton.textContent = "♫ Pause music";
        }).catch(function() {
            musicButton.textContent = "Music unavailable";
        });
    } else {
        music.pause();
        musicPlaying = false;
        musicButton.textContent = "♫ Play music";
    }
}

// FLOATING HEARTS
const heartSymbols = ["♡", "💕", "💗", "♥", "💖"];

function createHeart() {
    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = heartSymbols[
        Math.floor(Math.random() * heartSymbols.length)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    heart.style.animationDuration = (7 + Math.random() * 7) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 15000);
}

setInterval(createHeart, 700);
</script>

</body>
</html>
