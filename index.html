
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6c4d4" />
  <title>A little secret for you, bhondu ♡</title>

  <style>
    :root {
      --pink: #e99bb8;
      --pink-light: #fff0f5;
      --green: #849d7b;
      --green-dark: #526b4e;
      --cream: #fffdf4;
      --ink: #5d6d58;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f8eaf0;
      background-image:
        linear-gradient(rgba(255, 248, 250, .30), rgba(255, 248, 250, .30)),
        url("couple.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 22px 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      position: relative;
      animation: fadeIn 1.2s ease both;
    }

    .top-note {
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--green-dark);
      background: rgba(255,253,244,.82);
      border: 1px solid rgba(132,157,123,.5);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 4px 12px #a9a18c20;
    }

    .polaroid {
      width: min(76%, 310px);
      margin: 0;
      padding: 10px 10px 15px;
      background: #fff9fb;
      border: 2px solid #fff;
      border-radius: 4px;
      box-shadow: 0 8px 22px rgba(94, 74, 81, .20);
      transform: rotate(-2deg);
      position: relative;
    }

    .polaroid::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 24px;
      top: -13px;
      left: calc(50% - 41px);
      background: rgba(132,157,123,.58);
      transform: rotate(3deg);
      border-radius: 3px;
      z-index: 1;
    }

    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      border: 1px solid #f3dce5;
    }

    .polaroid figcaption {
      text-align: center;
      padding-top: 9px;
      font-family: "Segoe Print", "Comic Sans MS", cursive;
      font-size: 1rem;
      color: #9c7184;
    }

    .intro {
      text-align: center;
      width: 100%;
      background: rgba(255,253,244,.88);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 20px 8px 20px 8px;
      padding: 17px 14px 15px;
      box-shadow: 0 6px 20px rgba(89, 75, 74, .10);
    }

    h1 {
      margin: 0;
      color: #78916f;
      font-size: clamp(1.65rem, 7vw, 2.25rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }

    h1 .pink { color: #dc83a5; }

    .subtitle {
      min-height: 1.6em;
      margin: 10px 0 0;
      color: #bd7894;
      font-family: "Segoe Print", "Comic Sans MS", cursive;
      font-size: 1.05rem;
    }

    .flowers {
      font-size: 1.25rem;
      letter-spacing: .28em;
      margin-top: 8px;
    }

    .lock-card {
      width: 100%;
      background: rgba(255,253,244,.94);
      border: 1.5px dashed #9caf91;
      border-radius: 20px;
      padding: 19px 17px 17px;
      text-align: center;
      box-shadow: 0 7px 20px rgba(89, 75, 74, .12);
    }

    .prompt {
      font-weight: 700;
      color: #708568;
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .password-wrap { position: relative; }

    input {
      display: block;
      width: 100%;
      border: 2px solid #e7a1bb;
      background: #fff9fb;
      color: #526b4e;
      border-radius: 14px;
      padding: 14px 44px 14px 15px;
      font: inherit;
      font-size: 1rem;
      outline: none;
      transition: box-shadow .2s, border-color .2s;
    }

    input:focus {
      border-color: #849d7b;
      box-shadow: 0 0 0 4px rgba(132,157,123,.18);
    }

    input::placeholder { color: #c6a3b1; }

    .input-heart {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #df8eac;
      font-size: 1.2rem;
    }

    .unlock {
      width: 100%;
      margin-top: 13px;
      border: 2px solid #f7e9ee;
      border-radius: 999px;
      padding: 14px 16px;
      background: var(--green);
      color: white;
      font: inherit;
      font-weight: 700;
      font-size: 1.04rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #61795a;
      transition: transform .15s, box-shadow .15s, background .2s;
    }

    .unlock:hover { background: #718b68; }

    .unlock:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #61795a;
    }

    .error {
      display: none;
      margin: 15px 0 0;
      padding: 10px 12px;
      background: #ffe7ef;
      border: 1px solid #f0b1c7;
      color: #a34e6c;
      border-radius: 12px;
      font-size: .95rem;
      animation: wiggle .35s ease;
    }

    .music {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(132,157,123,.55);
      border-radius: 999px;
      background: rgba(255,253,244,.85);
      color: #627b5b;
      padding: 9px 13px;
      font: inherit;
      font-size: .88rem;
      cursor: pointer;
    }

    .music .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #c7c7c7;
      box-shadow: inset 0 0 0 2px #fff;
    }

    .music[aria-pressed="true"] .dot {
      background: #86a77b;
    }

    .footer-note {
      margin: auto 0 0;
      color: #7d9274;
      background: rgba(255,253,244,.78);
      border-radius: 12px;
      padding: 8px 13px;
      font-family: "Segoe Print", "Comic Sans MS", cursive;
      font-size: .9rem;
    }

    .float-heart {
      position: fixed;
      bottom: -30px;
      left: var(--left);
      color: #e78eae;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      animation: floatUp var(--duration) linear forwards;
      text-shadow: 0 1px 5px #fff;
    }

    .success-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(255,240,245,.96);
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      animation: fadeIn .7s ease both;
    }

    .success-card {
      width: min(100%, 360px);
      padding: 30px 22px;
      border: 2px solid #a7bd9b;
      border-radius: 24px;
      background: #fffdf4;
      box-shadow: 0 12px 35px #6c80632b;
    }

    .success-card h2 {
      color: #78916f;
      font-size: 2rem;
      margin: 0 0 10px;
    }

    .success-card p {
      color: #bd7894;
      line-height: 1.6;
    }

    .success-card button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: var(--green);
      color: white;
      font: inherit;
      cursor: pointer;
      font-weight: 700;
      margin: 12px 0;
    }

    .success-card button:hover { background: #718b68; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      10% { opacity: .8; }
      100% { transform: translateY(-115vh) rotate(28deg); opacity: 0; }
    }

    @keyframes wiggle {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    @media (min-width: 600px) {
      .page { padding-top: 30px; gap: 20px; }
      .polaroid { width: 280px; }
    }

    @media (max-width: 380px) {
      .page { padding-left: 12px; padding-right: 12px; }
      .lock-card { padding-left: 13px; padding-right: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="top-note">✿ our little world ✿</div>

    <figure class="polaroid">
      <img
        src="couple.jpg"
        alt="A favourite photo of us together"
      />
      <figcaption>my favourite person ♡</figcaption>
    </figure>

    <section class="intro" aria-label="Welcome">
      <h1 id="heading">
        A little secret for you
        <span class="pink">bhondu &lt;3</span>
      </h1>
      <p class="subtitle" id="subtitle">You and me forever 😙</p>
      <div class="flowers" aria-hidden="true">🌸 🦋 🌿 🌷</div>
    </section>

    <form class="lock-card" id="unlockForm">
      <p class="prompt">
        🔒 enter the password<br>
        <small>(don't get it wrong!)</small>
      </p>

      <div class="password-wrap">
        <input
          id="passwordInput"
          type="password"
          placeholder="our little secret..."
          autocomplete="off"
          aria-label="Enter password"
          required
        />
        <span class="input-heart" aria-hidden="true">♡</span>
      </div>

      <button class="unlock" type="submit">
        ♡ &nbsp; Unlock my heart ❤️
      </button>

      <p class="error" id="errorMessage" role="alert">
        Abey oo🤬dhang se (hint: our birthdate)
      </p>
    </form>

    <button class="music" id="musicToggle" type="button" aria-pressed="false">
      <span class="dot"></span>
      <span id="musicText">♫ Play our little tune</span>
    </button>

    <p class="footer-note">just two hearts, one little world ♡</p>
  </main>

  <section class="success-screen" id="successScreen" aria-live="polite">
    <div class="success-card">
      <div style="font-size:2.5rem">🌷💗🦋</div>
      <h2>Yay, bhondu!</h2>
      <p>
        You found our little secret.<br>
        Your letter is waiting for you ♡
      </p>
      <button type="button" id="continueButton">Continue ♡</button>
    </div>
  </section>

  <script>
    // Your correct password
    const PASSWORD = "0426";

    const form = document.getElementById("unlockForm");
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("errorMessage");
    const success = document.getElementById("successScreen");

    // Check the password when the form is submitted
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const entered = input.value.trim();

      if (entered === PASSWORD) {
        error.style.display = "none";
        success.style.display = "flex";
        burstHearts(18);
      } else {
        error.textContent =
          "Abey oo🤬dhang se (hint: our birthdate)";
        error.style.display = "block";
        input.select();
      }
    });

    // Continue to Page 2
    document.getElementById("continueButton").addEventListener("click", () => {
      window.location.href = "page2.html";
    });

    // Typing effect for the subtitle
    const subtitle = document.getElementById("subtitle");
    const subtitleText = "You and me forever 😙";

    subtitle.textContent = "";
    let charIndex = 0;

    function typeSubtitle() {
      if (charIndex < subtitleText.length) {
        subtitle.textContent += subtitleText.charAt(charIndex++);
        setTimeout(typeSubtitle, 75);
      }
    }

    window.addEventListener("load", () => {
      setTimeout(typeSubtitle, 550);
    });

    // Floating hearts
    function makeHeart() {
      const heart = document.createElement("span");
      heart.className = "float-heart";
      heart.textContent = Math.random() > .5 ? "♡" : "♥";
      heart.style.setProperty("--left", Math.random() * 96 + "vw");
      heart.style.setProperty(
        "--duration",
        (6 + Math.random() * 5) + "s"
      );
      heart.style.fontSize = (14 + Math.random() * 18) + "px";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 11500);
    }

    setInterval(makeHeart, 1250);

    // A little burst of hearts when the password is correct
    function burstHearts(amount) {
      for (let i = 0; i < amount; i++) {
        setTimeout(makeHeart, i * 90);
      }
    }

    // Tiny synthesized tune — no separate audio file needed
    let audioContext = null;
    let musicTimer = null;
    let noteIndex = 0;

    const notes = [
      523.25, 659.25, 783.99, 659.25,
      587.33, 659.25, 523.25, 392.00
    ];

    const musicButton = document.getElementById("musicToggle");
    const musicText = document.getElementById("musicText");

    function playNote() {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = notes[noteIndex % notes.length];

      gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.055, audioContext.currentTime + 0.04
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001, audioContext.currentTime + 0.42
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.45);

      noteIndex++;
    }

    musicButton.addEventListener("click", async () => {
      const isPlaying =
        musicButton.getAttribute("aria-pressed") === "true";

      if (isPlaying) {
        clearInterval(musicTimer);
        musicTimer = null;
        musicButton.setAttribute("aria-pressed", "false");
        musicText.textContent = "♫ Play our little tune";
      } else {
        const AudioCtx =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioCtx) {
          musicText.textContent =
            "Music isn't supported in this browser";
          return;
        }

        audioContext = audioContext || new AudioCtx();

        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        playNote();
        musicTimer = setInterval(playNote, 520);

        musicButton.setAttribute("aria-pressed", "true");
        musicText.textContent = "♫ Pause our little tune";
      }
    });

    // Stop the tune if the page is hidden
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
        musicButton.setAttribute("aria-pressed", "false");
        musicText.textContent = "♫ Play our little tune";
      }
    });
  </script>
</body>
</html>
